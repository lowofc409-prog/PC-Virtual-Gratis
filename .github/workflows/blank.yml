name: PC Virtual

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurar senha do usuário
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd

      - name: Instalar servidor gráfico e ferramentas
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvncserver

      - name: Instalar Ngrok
        uses: ngrok/ngrok-action@v1
        with:
          auth-token: ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Iniciar servidor VNC
        run: |
          mkdir -p ~/.vnc
          echo "runner" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          vncserver :1 -geometry 1280x720 -depth 24

          echo "Servidor VNC iniciado na porta 5901"

      - name: Conectar VNC via Ngrok
        run: |
          ngrok tcp 5901 &

      - name: Manter a máquina ativa
        run: |
          echo "PC Virtual pronto!"
          sleep infinity
